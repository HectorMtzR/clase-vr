<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR con A-Frame + AR.js</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <!-- Librería A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- Librería AR.js para A-Frame (detección de marcadores) -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- Marcador Hiro (el clásico, viene predefinido en AR.js) -->
    <a-marker preset="hiro">
      <!-- Componentes 3D de ejemplo dentro del marcador -->
      <a-box position="0 0.5 0" material="color: red;" scale="0.5 0.5 0.5"></a-box>
      <a-sphere position="0 1.2 0" radius="0.3" color="blue"></a-sphere>
      <a-cylinder position="1 0.5 0" radius="0.3" height="1" color="green"></a-cylinder>
    </a-marker>

    <!-- Cámara para AR.js -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
